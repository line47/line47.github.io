---
layout: base
html_class: layout-article
title_prefix: "Scott Weber & Line 47 Articles // "
---
<div class="hero">
  <div class="content-container">
    <h1 class="lead">{{ page.title }}</h1>
    <p>{{ page.summary }}</p>
    <p class="timeframe">Published {{ page.date | date: "%b %-d, %Y" }}</p>
    {% if page.image %}<img src="{{ page.image }}" alt="">{% endif %}
  </div>
</div>
<div class="content-container">
  <div class="main-content">
    {{ content }}
  </div>
</div>
<script>
  // Make horizontally scrolling code blocks reachable by keyboard (WCAG 2.1.1)
  (function () {
    function update() {
      document.querySelectorAll('.main-content pre').forEach(function (pre) {
        if (pre.scrollWidth > pre.clientWidth) {
          pre.setAttribute('tabindex', '0');
          pre.setAttribute('role', 'region');
          pre.setAttribute('aria-label', 'Code example (scrollable)');
        } else {
          pre.removeAttribute('tabindex');
          pre.removeAttribute('role');
          pre.removeAttribute('aria-label');
        }
      });
    }
    update();
    window.addEventListener('resize', update);
  }());
</script>
