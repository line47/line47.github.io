{%- comment -%}
  Section hero used by the Work and Music sections.
  Usage: {% include hero.html title="..." text="..." class="hero--compact" %}  (text may contain HTML)
{%- endcomment -%}
<div class="hero{% if include.class %} {{ include.class }}{% endif %}">
    <div class="content-container">
        <div class="right-grid">
            <h1>{{ include.title }}</h1>
            {% if include.text %}<p class="section-title">{{ include.text }}</p>{% endif %}
        </div>
    </div>
</div>
